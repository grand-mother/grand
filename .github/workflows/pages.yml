# Deploys the documentation to GitHub Pages.
#
# Deliberately without -W, unlike the docs job in lint.yml.  That job is the
# gate and should fail on a warning; this one exists to publish, and a
# warning is not a reason to leave the site stale.
name: Documentation Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: env/conda/grand-dev.yml
          activate-environment: grand-dev
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate: false

      # The data model is ~1 GB fetched from forge.in2p3.fr, a single host with
      # no mirror.  Two jobs on one push failed on it -- one 502, one truncated
      # at 358 of 976 MB -- while a third passed, which is what an unreliable
      # transfer looks like rather than an outage.  Caching removes the fetch
      # from almost every run, and env/setup.sh becomes a no-op when the
      # restored version matches.
      #
      # No restore-keys: a near-miss would restore a *different* model version,
      # which is worse than downloading. The key is the version flag itself,
      # which changes exactly when the model does.
      - name: Cache the data model
        uses: actions/cache@v6
        with:
          path: |
            data/detector
            data/noise
            data/topography
          key: grand-data-model-${{ hashFiles('data/model_version.flag') }}

      - name: Build the C extensions and install the package
        run: |
          source env/setup.sh
          pip install -e . --no-deps --no-build-isolation

      - name: Build the documentation
        run: |
          source env/setup.sh
          cd docs && make html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html
      - id: deploy
        uses: actions/deploy-pages@v4
