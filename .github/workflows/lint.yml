# Code quality: linting, the docstring ratchet, and a strict documentation
# build.  Kept apart from tests.yml because it costs a couple of minutes
# where the suite costs twenty, so it can be read and retried on its own.
name: Code Quality

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruff:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff
      # The D rules are the docstring ratchet: pyproject.toml carries a
      # per-file-ignores list of modules not yet converted to numpydoc.  That
      # list may shrink and must never grow, which is what this enforces.
      - name: Ruff
        run: ruff check grand/ tests/ quality/ notebooks/ docs/dev/

  handbook:
    name: Handbook PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install a LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      # --check compiles and reports without installing the result.  Its own
      # job so that a LaTeX error is reported as a LaTeX error, rather than
      # surfacing as an unexplained documentation failure.  The Handbook is
      # somebody else's document and this is the only thing that would notice
      # if a new revision of it stopped compiling.
      - name: Compile the Handbook
        run: python docs/dev/build_handbook_pdf.py --check

      # The .rst pages under docs/source/handbook/ are generated from the same
      # source and committed.  If the zip changes and nobody re-runs the
      # generator, the site and the PDF disagree; this catches that.
      #
      # It compares the recorded SHA-256 of the source archive, not the
      # converted text.  Re-running pandoc and diffing looked like the obvious
      # check and does not work: pandoc's output differs between versions in
      # whitespace and in whether it emits ":width:" on an image, so on a
      # runner whose pandoc differs from the one that generated the committed
      # pages -- Ubuntu's against the one used locally -- every line of every
      # page differs and the job fails with a false report of staleness.
      # It did exactly that on the first run.
      - name: Check the generated pages are current
        run: python docs/dev/build_handbook.py --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: env/conda/grand-dev.yml
          activate-environment: grand-dev
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate: false

      # `make html` compiles the Handbook PDF first, because the documentation
      # links to it with :download: and a missing target is a warning.  The
      # recipe falls back to the copy in resources/ when pdflatex is absent, so
      # this install is what makes the *patched* PDF -- with the errata and the
      # provenance block -- the one that gets published.
      #
      # recommended is enough for this document: article, geometry, graphicx,
      # amsmath, listings, longtable, hyperref.  texlive-full is ~5 GB and
      # would dominate the job.
      - name: Install a LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      # jupyter-sphinx executes the docstring examples in a real kernel, a
      # separate process from Sphinx.  The package therefore has to be
      # importable properly, not merely findable on sys.path.
      # The data model is ~1 GB fetched from forge.in2p3.fr, a single host with
      # no mirror.  Two jobs on one push failed on it -- one 502, one truncated
      # at 358 of 976 MB -- while a third passed, which is what an unreliable
      # transfer looks like rather than an outage.  Caching removes the fetch
      # from almost every run, and env/setup.sh becomes a no-op when the
      # restored version matches.
      #
      # No restore-keys: a near-miss would restore a *different* model version,
      # which is worse than downloading. The key is the version flag itself,
      # which changes exactly when the model does.
      - name: Cache the data model
        uses: actions/cache@v6
        with:
          path: |
            data/detector
            data/noise
            data/topography
          key: grand-data-model-${{ hashFiles('data/model_version.flag') }}

      - name: Build the C extensions and install the package
        run: |
          source env/setup.sh
          pip install -e . --no-deps --no-build-isolation

      # The gate: any Sphinx warning fails the build.  It is what stops the
      # documentation drifting from the code the way docs/package/grand.rst
      # did, describing modules that had been renamed years earlier.
      #
      # Not `-W`, though, and the reason is specific.  jupyter-sphinx treats
      # *anything* a cell writes to stderr as a warning, and ROOT's cling JIT
      # writes a CPU-feature diagnostic there on some hardware:
      #
      #   warning: invalid feature combination: +avx10.1-256;
      #            will be promoted to avx10.1-512
      #
      # That depends on the runner's processor, not on the documentation, and
      # it appears on GitHub's runners while not appearing on a typical
      # developer machine.  Under `-W` it fails the build for a reason no one
      # can act on.  So the build runs without -W and the log is checked
      # afterwards, with that one diagnostic and its jupyter-sphinx wrapper
      # filtered out.  Every other warning still fails the job.
      - name: Build the documentation
        run: |
          source env/setup.sh
          cd docs && make html SPHINXOPTS="--keep-going" 2>&1 | tee /tmp/sphinx.log

      - name: Fail on any Sphinx warning
        run: |
          grep -E "WARNING|ERROR" /tmp/sphinx.log \
            | grep -vE "invalid feature combination|Cell printed to stderr" \
            | grep -vE "IPKernelApp|myst v[0-9]" \
            > /tmp/sphinx.problems || true
          if [ -s /tmp/sphinx.problems ]; then
            echo "The documentation build reported problems:"
            cat /tmp/sphinx.problems
            exit 1
          fi
          echo "No documentation warnings."
