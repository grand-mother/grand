# Executes the tutorial notebooks.
#
# Its own workflow rather than a job in lint.yml, because it costs minutes
# where the linter costs seconds, and because it is not a gate: a notebook that
# stops running is worth knowing about but should not block a code change.
#
# Weekly rather than per-push for the same reason -- the notebooks change
# rarely and executing them is slow.
name: Notebooks

on:
  schedule:
    - cron: '0 5 * * 1'          # Mondays, 05:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'notebooks/**'
      - '.github/workflows/notebooks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: env/conda/grand-dev.yml
          activate-environment: grand-dev
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate: false

      # The data model is ~1 GB fetched from forge.in2p3.fr, a single host with
      # no mirror.  Two jobs on one push failed on it -- one 502, one truncated
      # at 358 of 976 MB -- while a third passed, which is what an unreliable
      # transfer looks like rather than an outage.  Caching removes the fetch
      # from almost every run, and env/setup.sh becomes a no-op when the
      # restored version matches.
      #
      # No restore-keys: a near-miss would restore a *different* model version,
      # which is worse than downloading. The key is the version flag itself,
      # which changes exactly when the model does.
      - name: Cache the data model
        uses: actions/cache@v6
        with:
          path: |
            data/detector
            data/noise
            data/topography
          key: grand-data-model-${{ hashFiles('data/model_version.flag') }}

      - name: Build the C extensions and install the package
        run: |
          source env/setup.sh
          pip install -e . --no-deps --no-build-isolation

      - name: Execute every notebook
        run: |
          source env/setup.sh
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            python -m jupyter execute "$nb" --output=/tmp/out.ipynb
            echo "::endgroup::"
          done
