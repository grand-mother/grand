# Does the Docker installation route still work?
#
# Manual only.  This is a diagnostic, not a gate: the Handbook presents Docker
# as the first installation route while the published images date from January
# 2023 and pin ROOT 6.26.02 against 6.36/6.38 everywhere else, and nobody knows
# whether the combination still runs.  See issue-docker-unmaintained in the
# documentation.
#
# It runs here rather than on a developer machine for a practical reason: the
# image is ~3 GB uncompressed and the data model another ~2 GB at peak, and a
# runner has that to spare where a laptop at 97 % does not.  It is also safer.
# Running the container against a working checkout would recompile TURTLE and
# GULL into it -- built against ROOT 6.26 and Ubuntu 20.04's glibc -- and
# overwrite the host's, breaking the conda environment in a way that would take
# a while to diagnose.  Here the whole machine is thrown away afterwards.
#
# What the repository's own history says, which is worth knowing before reading
# a failure here as "Docker is broken":
#
#   * The previous workflow, tests_with_docker.yml, has not *executed* since at
#     least 2025-08-07.  All 41 runs in that window ended `cancelled` after
#     24h0m2s with "The job has exceeded the maximum execution time while
#     awaiting a runner".  It pinned `runs-on: ubuntu-20.04`, a runner image
#     GitHub has since retired, so the job queued forever for a label that no
#     longer exists.  It never failed; it stopped being scheduled.  So there is
#     no evidence that Docker broke for any reason to do with Docker -- only
#     that nothing has checked in over a year.
#
#   * 34 of the 36 branches still carry that file, so each push to them still
#     burns a 24-hour queue slot and shows a red cross.  Retiring it repo-wide
#     belongs with the Phase 10 cleanup.
#
#   * Four images exist, and they are not interchangeable:
#       grandlib/dev:1.2          2023-01-14, Docker Hub, what the Handbook
#                                 tells users to pull
#       grandlib/dev:2.0          2022-11-18, arm64
#       jcolley/grandlib_ci:0.1   2022-01-31, what the old CI used
#       grand_docker_handson_2025 2025, distributed as a tarball on Google
#                                 Drive rather than a registry, so CI cannot
#                                 pull it -- but it is the newest that exists
#                                 and suggests a working 2025 image is out
#                                 there
#
# This uses `docker run` with a bind mount rather than the `container:` key the
# old workflow used, deliberately.  With `container:` the checkout action runs
# *inside* the image, which makes the job's success depend on that image
# carrying a runtime GitHub's actions can use; with `docker run` the checkout
# happens on the runner and the container only ever runs bash, so a failure is
# unambiguously about the container and not about the plumbing around it.
#
# Two independent questions, one job each:
#
#   published-image  does the image users are told to pull work with the code?
#   build-images     do the Dockerfiles in this repository still build?
#
# They can differ.  The published images cannot be rebuilt from the current
# Dockerfiles anyway -- the base pins a ROOT release from 2022 -- so a failure
# in one says nothing about the other.
name: Docker

on:
  # Two triggers, and the second exists because the first does not work yet.
  #
  # GitHub only offers workflow_dispatch for a workflow file that exists on the
  # *default* branch.  This repository's default is master, 1163 commits behind
  # dev, so anything added here is untriggerable from the Actions tab until
  # Phase 9 promotes dev-next:
  #
  #     HTTP 404: workflow docker.yml not found on the default branch
  #
  # The push trigger is the way round it.  Pushing this branch's content to a
  # branch named ci/docker-test runs the job against it, from anywhere:
  #
  #     git push origin dev-next:ci/docker-test --force
  #
  # A dedicated branch name rather than a paths filter on this file, so that
  # editing the workflow does not run it and running it does not require
  # editing it.
  push:
    branches:
      - 'ci/docker-test**'

  workflow_dispatch:
    inputs:
      image:
        description: >-
          Published image to test.  grandlib/dev:1.2 is what the Handbook tells
          users to pull; jcolley/grandlib_ci:0.1 is what the old CI used.
        required: true
        default: 'grandlib/dev:1.2'
      build_images:
        description: >-
          Also build the Dockerfiles.  Off by default: it answers a different
          question from "does the published image work", and it is the slower
          and more fragile half -- pip resolving 53 unpinned packages against
          Python 3.8 has a lot of room to backtrack.
        type: boolean
        required: false
        default: false
      refs:
        description: >-
          Branches to test inside it, comma-separated.  Testing dev-next and
          dev together is what separates "Docker is stale" from "dev-next broke
          Docker".
        required: true
        default: 'dev-next,dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ matrix
  # The refs input is a string; this turns it into a JSON array the matrix can
  # consume, so the caller can test one branch or several without editing the
  # workflow.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.split.outputs.refs }}
    steps:
      - id: split
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          raw = os.environ['REFS']
          refs = [r.strip() for r in raw.split(',') if r.strip()]
          print('refs=' + json.dumps(refs))
          PY
        env:
          # inputs is empty on the push trigger, so fall back to the pair that
          # makes the result interpretable: dev-next against dev.
          REFS: ${{ inputs.refs || 'dev-next,dev' }}

  # -------------------------------------------------------- published image
  published-image:
    name: Published image / ${{ matrix.ref }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false        # test every ref even when one fails
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    env:
      # inputs is empty on the push trigger; 1.2 is the newest published image.
      IMAGE: ${{ inputs.image || 'grandlib/dev:1.2' }}
    steps:
      # The image is ~3 GB and the data model ~1 GB extracted, against about
      # 14 GB free on a fresh runner.  That is comfortable, so this only
      # reports -- deleting the preinstalled toolchains costs a minute or two
      # per job and buys space nothing here needs.
      - name: Report free disk
        run: df -h / | tail -1

      - name: Check out the branch under test
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: checkout

      - name: Pull the image and report what is in it
        run: |
          docker pull "$IMAGE"
          {
            echo "### ${{ matrix.ref }} in \`$IMAGE\`"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| image size on disk | $(docker image inspect "$IMAGE" --format '{{.Size}}' | awk '{printf "%.1f GB", $1/1e9}') |"
            echo "| python | $(docker run --rm "$IMAGE" python3 --version 2>&1 | tr -d '\n') |"
            echo "| ROOT | $(docker run --rm "$IMAGE" bash -lc 'root-config --version' 2>&1 | tr -d '\n') |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Each step re-sources env/setup.sh, because a container does not survive
      # between steps but its effects on the mounted checkout do.  Splitting it
      # this way is deliberate: it makes GitHub show *which* stage failed,
      # rather than one opaque red cross on a single long script.
      - name: 'Stage 1: env/setup.sh (compiles TURTLE and GULL, fetches ~1 GB)'
        # Bounded separately: this is the step that reaches forge.in2p3.fr, and
        # that host has already produced a 502 and a truncated transfer in this
        # repository's history.  The download script retries four times with
        # backoff; if it is still going after 25 minutes the host is the
        # problem, not the container.
        timeout-minutes: 25
        run: |
          docker run --rm -v "$PWD/checkout:/work" -w /work "$IMAGE" \
            bash -lc 'source env/setup.sh'

      # Written to a file rather than passed inline: quoting Python inside
      # bash -lc inside YAML is three levels of escaping and gets misread by
      # everyone who edits it afterwards.
      - name: 'Stage 2: import grand'
        run: |
          cat > checkout/_probe.py <<'PY'
          import sys

          import numpy
          import ROOT

          import grand
          import grand.dataio.descriptors as descriptors

          print('grand   ', grand.__file__)
          print('ROOT    ', ROOT.gROOT.GetVersion(), '(int %d)' % ROOT.gROOT.GetVersionInt())
          print('numpy   ', numpy.__version__)
          print('python  ', sys.version.split()[0])
          print('high_root_version =', descriptors.high_root_version)
          if not descriptors.high_root_version:
              print()
              print('NOTE: this is the ROOT < 6.36 code path, which the conda CI')
              print('matrix never exercises -- both of its legs are >= 6.36.')
          PY
          docker run --rm -v "$PWD/checkout:/work" -w /work "$IMAGE" \
            bash -lc 'source env/setup.sh >/dev/null 2>&1 && python3 _probe.py'

      # dataio is where the ROOT-version branch lives, so it is the part most
      # likely to behave differently on 6.26 -- and the part CI never covers,
      # since both legs of the conda matrix are >= 6.36 and take the other
      # branch.
      - name: 'Stage 3: the dataio suite'
        run: |
          docker run --rm -v "$PWD/checkout:/work" -w /work "$IMAGE" \
            bash -lc 'source env/setup.sh >/dev/null && python3 -m pytest tests/dataio -q'

      - name: 'Stage 4: the whole suite'
        run: |
          docker run --rm -v "$PWD/checkout:/work" -w /work "$IMAGE" \
            bash -lc 'source env/setup.sh >/dev/null && python3 -m pytest tests/ -q'

      - name: Record the outcome
        if: always()
        run: |
          echo "| result | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------- build the images
  build-images:
    name: Build the Dockerfiles
    # Opt-in only.  On the push trigger there are no inputs, so this is skipped
    # and the run costs one job per ref rather than three.
    if: ${{ inputs.build_images }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Report free disk
        run: df -h / | tail -1

      - uses: actions/checkout@v7

      # The build scripts assemble their requirements files by copying them out
      # of the repository first, so they must be run from their own directory
      # rather than the Dockerfiles being built directly.  One of those copies
      # pointed at docs/apidoc-only/, deleted when the Sphinx tree was rebuilt;
      # this job is what would have caught that.
      - name: base
        working-directory: env/docker_amd64
        timeout-minutes: 30
        run: bash build_base.sh

      - name: dev
        working-directory: env/docker_amd64
        timeout-minutes: 30
        run: bash build_dev.sh

      - name: Report the images
        if: always()
        run: |
          {
            echo '### Images built from env/docker_amd64'
            echo
            echo '```'
            docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
