<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="100%" font-family="IBM Plex Sans, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8994"/></marker></defs>
<rect width="940" height="470" rx="6" fill="#FBFCFC" stroke="#D8DEE3"/>
<text x="40" y="38" font-size="15" font-weight="600" fill="#14202A">Coordinate frames, and what converts to what</text>
<text x="40" y="58" font-size="11" fill="#4C5C69">Every conversion passes through ECEF. There is no direct path between a local frame and geodetic.</text>
<rect x="40" y="90" width="210" height="96" rx="5" fill="#E2F0F0" stroke="#0E6E70" stroke-width="1.4"/>
<text x="145" y="114" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#0E6E70" text-anchor="middle">Geodetic</text>
<text x="145" y="134" font-size="10.5" fill="#4C5C69" text-anchor="middle">latitude, longitude, height</text>
<text x="145" y="148" font-size="10.5" fill="#4C5C69" text-anchor="middle">degrees and metres</text>
<text x="145" y="162" font-size="10.5" fill="#4C5C69" text-anchor="middle">height needs a Reference</text>
<rect x="365" y="90" width="210" height="96" rx="5" fill="#F6EDDA" stroke="#8A6210" stroke-width="1.4"/>
<text x="470" y="114" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#8A6210" text-anchor="middle">ECEF</text>
<text x="470" y="134" font-size="10.5" fill="#4C5C69" text-anchor="middle">Earth-centred, Earth-fixed</text>
<text x="470" y="148" font-size="10.5" fill="#4C5C69" text-anchor="middle">metres from the geocentre</text>
<text x="470" y="162" font-size="10.5" fill="#4C5C69" text-anchor="middle">the common pivot</text>
<rect x="690" y="60" width="210" height="78" rx="5" fill="#E1F1EA" stroke="#1D7A57" stroke-width="1.4"/>
<text x="795" y="84" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#1D7A57" text-anchor="middle">LTP</text>
<text x="795" y="104" font-size="10.5" fill="#4C5C69" text-anchor="middle">local tangent plane</text>
<text x="795" y="118" font-size="10.5" fill="#4C5C69" text-anchor="middle">x East, y North, z Up</text>
<rect x="690" y="158" width="210" height="78" rx="5" fill="#E1F1EA" stroke="#1D7A57" stroke-width="1.4"/>
<text x="795" y="182" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#1D7A57" text-anchor="middle">GRANDCS</text>
<text x="795" y="202" font-size="10.5" fill="#4C5C69" text-anchor="middle">the array frame</text>
<text x="795" y="216" font-size="10.5" fill="#4C5C69" text-anchor="middle">x North, y West, z Up</text>
<line x1="250" y1="138" x2="365" y2="138" stroke="#7A8994" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="308" y="130" font-size="10" fill="#7A8994" text-anchor="middle">ECEF(g) / Geodetic(e)</text>
<line x1="575" y1="120" x2="690" y2="99" stroke="#7A8994" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="632" y="102" font-size="10" fill="#7A8994" text-anchor="middle">rotation</text>
<line x1="575" y1="156" x2="690" y2="197" stroke="#7A8994" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="632" y="192" font-size="10" fill="#7A8994" text-anchor="middle">rotation</text>
<text x="40" y="238" font-size="12" font-weight="600" fill="#9C3830">The trap</text>
<rect x="40" y="250" width="860" height="86" rx="5" fill="#F7E6E4" stroke="#9C3830" stroke-width="1.2"/>
<text x="60" y="274" font-size="11" fill="#4C5C69">GRANDCS and LTP take the same three numbers and mean different things by them: GRANDCS x runs North, ENU x runs East.</text>
<text x="60" y="292" font-size="11" fill="#4C5C69">At Dunhuang, GRANDCS(x=1000, y=0, z=0) and LTP(x=1000, y=0, z=0) name points 1410 m apart — with no error raised,</text>
<text x="60" y="310" font-size="11" fill="#4C5C69">no warning, and both results perfectly valid. Name the frame in the variable, not just in the constructor.</text>
<text x="40" y="374" font-size="12" font-weight="600" fill="#0E6E70">Heights</text>
<line x1="40" y1="404" x2="440" y2="404" stroke="#0E6E70" stroke-width="2"/>
<text x="450" y="408" font-size="10.5" fill="#4C5C69">WGS-84 ellipsoid — Reference.ELLIPSOID</text>
<path d="M 40 428 q 100 -12 200 0 q 100 12 200 0" fill="none" stroke="#8A6210" stroke-width="2" stroke-dasharray="5 3"/>
<text x="450" y="432" font-size="10.5" fill="#4C5C69">geoid, mean sea level — Reference.GEOID</text>
<text x="40" y="454" font-size="10.5" fill="#7A8994">They differ by up to ~100 m worldwide, and by −7.75 m at Dunhuang. A height without a reference is not a height.</text>
</svg>
