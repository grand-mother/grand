<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Inter, Helvetica, Arial, sans-serif">
<defs>
<marker id="h1D7A57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D7A57"/></marker>
<marker id="hB4472A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4472A"/></marker>
<marker id="h0E6E70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E6E70"/></marker>
<marker id="h7A8994" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A8994"/></marker>
</defs>
<rect width="1000" height="480" fill="#FFFFFF"/>
<text x="30.0" y="34.0" font-size="15" fill="#14202A" text-anchor="start" font-weight="600">An antenna arm is not a field component</text>
<text x="30.0" y="54.0" font-size="11" fill="#4C5C69" text-anchor="start" font-weight="400">V_oc is the projection of E onto the effective length, in the spherical basis of the arrival direction.</text>
<line x1="60" y1="300" x2="440" y2="300" stroke="#D8DEE3" stroke-width="1.2"/>
<text x="66.0" y="316.0" font-size="9.5" fill="#7A8994" text-anchor="start" font-weight="400">ground</text>
<line x1="250.0" y1="300.0" x2="250.0" y2="180.0" stroke="#1D7A57" stroke-width="1.8" marker-end="url(#h1D7A57)"/>
<text x="258.0" y="178.0" font-size="10.5" fill="#1D7A57" text-anchor="start" font-weight="600">Z arm</text>
<line x1="250.0" y1="300.0" x2="355.0" y2="258.0" stroke="#1D7A57" stroke-width="1.8" marker-end="url(#h1D7A57)"/>
<text x="360.0" y="256.0" font-size="10.5" fill="#1D7A57" text-anchor="start" font-weight="600">EW arm</text>
<line x1="250.0" y1="300.0" x2="145.0" y2="258.0" stroke="#1D7A57" stroke-width="1.8" marker-end="url(#h1D7A57)"/>
<text x="140.0" y="256.0" font-size="10.5" fill="#1D7A57" text-anchor="end" font-weight="600">SN arm</text>
<line x1="75.7" y1="224.7" x2="236.0" y2="234.0" stroke="#7A8994" stroke-width="2.0" marker-end="url(#h7A8994)"/>
<text x="79.7" y="214.7" font-size="10" fill="#7A8994" text-anchor="start" font-weight="400">incoming wave, zenith 85°</text>
<line x1="210.0" y1="204.0" x2="214.0" y2="249.8" stroke="#0E6E70" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#h0E6E70)"/>
<text x="264.0" y="222.0" font-size="12" fill="#0E6E70" text-anchor="start" font-weight="600">θ̂</text>
<line x1="210.0" y1="204.0" x2="174.0" y2="182.0" stroke="#0E6E70" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#h0E6E70)"/>
<text x="158.0" y="180.0" font-size="12" fill="#0E6E70" text-anchor="start" font-weight="600">φ̂</text>
<line x1="210.0" y1="204.0" x2="244.0" y2="152.0" stroke="#B4472A" stroke-width="2.2" marker-end="url(#hB4472A)"/>
<text x="248.0" y="150.0" font-size="12" fill="#B4472A" text-anchor="start" font-weight="600">E</text>
<text x="250.0" y="352.0" font-size="11" fill="#4C5C69" text-anchor="middle" font-weight="600">the geometry</text>
<text x="250.0" y="370.0" font-size="9.5" fill="#7A8994" text-anchor="middle" font-weight="400">θ̂ and φ̂ are set by where the shower came from,</text>
<text x="250.0" y="384.0" font-size="9.5" fill="#7A8994" text-anchor="middle" font-weight="400">not by how the antenna is built.</text>
<line x1="500" y1="86" x2="500" y2="392" stroke="#D8DEE3"/>
<text x="540.0" y="108.0" font-size="12" fill="#14202A" text-anchor="start" font-weight="600">Effective length at 100 MHz, zenith 85°</text>
<text x="540.0" y="134.0" font-size="10.5" fill="#4C5C69" text-anchor="start" font-weight="600" font-family="IBM Plex Mono, monospace">arm</text>
<text x="680.0" y="134.0" font-size="10.5" fill="#4C5C69" text-anchor="end" font-weight="600" font-family="IBM Plex Mono, monospace">|ℓ_θ| [m]</text>
<text x="790.0" y="134.0" font-size="10.5" fill="#4C5C69" text-anchor="end" font-weight="600" font-family="IBM Plex Mono, monospace">|ℓ_φ| [m]</text>
<text x="540.0" y="154.0" font-size="10.5" fill="#14202A" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, monospace">sn</text>
<text x="680.0" y="154.0" font-size="10.5" fill="#14202A" text-anchor="end" font-weight="400" font-family="IBM Plex Mono, monospace">0.060</text>
<text x="790.0" y="154.0" font-size="10.5" fill="#14202A" text-anchor="end" font-weight="400" font-family="IBM Plex Mono, monospace">0.796</text>
<text x="540.0" y="174.0" font-size="10.5" fill="#14202A" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, monospace">ew</text>
<text x="680.0" y="174.0" font-size="10.5" fill="#14202A" text-anchor="end" font-weight="400" font-family="IBM Plex Mono, monospace">0.086</text>
<text x="790.0" y="174.0" font-size="10.5" fill="#14202A" text-anchor="end" font-weight="400" font-family="IBM Plex Mono, monospace">0.799</text>
<text x="540.0" y="194.0" font-size="10.5" fill="#14202A" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, monospace">z</text>
<text x="680.0" y="194.0" font-size="10.5" fill="#14202A" text-anchor="end" font-weight="400" font-family="IBM Plex Mono, monospace">0.603</text>
<text x="790.0" y="194.0" font-size="10.5" fill="#14202A" text-anchor="end" font-weight="400" font-family="IBM Plex Mono, monospace">0.011</text>
<line x1="540" y1="140" x2="790" y2="140" stroke="#D8DEE3"/>
<text x="540.0" y="236.0" font-size="10.5" fill="#4C5C69" text-anchor="start" font-weight="400">The Z arm is the most sensitive of the three here —</text>
<text x="540.0" y="252.0" font-size="10.5" fill="#4C5C69" text-anchor="start" font-weight="400">and it is the one that sees almost nothing.</text>
<rect x="540" y="272" width="420" height="86" rx="5" fill="#FBEDE9" stroke="#B4472A" stroke-width="1.4"/>
<text x="556.0" y="294.0" font-size="11" fill="#B4472A" text-anchor="start" font-weight="600">In notebook 06</text>
<text x="556.0" y="314.0" font-size="10.5" fill="#14202A" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, monospace">input field components   1.0 : 0.6 : 0.2</text>
<text x="556.0" y="332.0" font-size="10.5" fill="#14202A" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, monospace">output arm amplitudes    600 : 400 : 1</text>
<text x="556.0" y="350.0" font-size="9.5" fill="#B4472A" text-anchor="start" font-weight="400">The ratio is set by the direction, not the field.</text>
<line x1="30" y1="418" x2="970" y2="418" stroke="#D8DEE3"/>
<text x="30.0" y="440.0" font-size="10.5" fill="#7A8994" text-anchor="start" font-weight="400">Consequence: an analysis that treats the three channels as a Cartesian decomposition of E is wrong, and wrong in a</text>
<text x="30.0" y="456.0" font-size="10.5" fill="#7A8994" text-anchor="start" font-weight="400">direction-dependent way that does not look like a bug. Rotate through the effective length instead.</text>
</svg>
